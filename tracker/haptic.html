<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- Временная проверка вибрации на iPhone: какой способ срабатывает. После проверки — удалить -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <title>Haptics test</title>
    <link rel="stylesheet" href="haptic.css">
    <script type="module" src="haptic.js"></script>
  </head>
  <body>
    <h1>Haptics test · round 2</h1>
    <p class="info" id="info"></p>
    <p>Tap cards 1–5 with your finger — on the text, not on the edge. Card 6 — slide, don't tap. Write down the numbers you <b>felt</b>.</p>

    <label class="card"><b>1</b> Visible switch — tap the switch itself <input type="checkbox" switch data-log="1"></label>

    <div class="card">
      <b>2</b> Invisible switch covering the card
      <input class="cover" type="checkbox" switch data-log="2" aria-label="Test 2">
    </div>

    <label class="card"><b>3</b> Card is a label, hidden switch inside
      <input class="ghost" type="checkbox" switch data-log="3"></label>

    <label class="card" for="t4"><b>4</b> Card is a label, switch elsewhere on the page</label>

    <label class="card"><b>5</b> Card is a label, switch not drawn at all
      <input class="gone" type="checkbox" switch data-log="5"></label>

    <div class="card card-tall">
      <b>6</b> Slide your finger left and right across this card without lifting it
      <input class="cover" type="checkbox" switch data-log="6" aria-label="Test 6">
    </div>

    <input class="ghost" id="t4" type="checkbox" switch data-log="4">
    <p class="log" id="log">Nothing tapped yet</p>
  </body>
</html>
