name: Pages

# Портфолио собирается и уезжает на GitHub Pages отдельно от репозитория TTS.
# Перед сборкой гоняется npm run check: расхождение токенов или нарушение
# правил стража роняет публикацию, а не приезжает на витрину.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права по минимуму и по задачам: сборка ставит чужие пакеты и прав
# на публикацию не получает, публикация чужого кода не запускает.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # скрипты установки пакетам не нужны, а чужой postinstall — вектор атаки
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read     # скачать артефакт сборки
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
